<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreamy Cafe</title>
  <link rel="stylesheet" href="./assets/css/bootstrap-4.6.2/bootstrap.min.css" />
  <link rel="stylesheet" href="./assets/css/main.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>

<header>
  <div class="header">
    <div class="header__left">
      <div class="header__left--icon-app">
        <a href=""><img src="./assets/images/img_icon_app.png" alt=""></a>
      </div>
      <div class="header__left--logo-dreamy">
        <a href=""><img src="./assets/images/img_logo_dreamy.png" alt=""></a>
      </div>
    </div>
    <div class="header__center">
      <div class="header__center--item">
        <a href=""><img src="./assets/images/btn_download_header.png" alt=""></a>
      </div>
      <div class="header__center--item">
        <a href="">Tải ngay đạt mốc</a>
      </div>
      <div class="header__center--item">
        <a href="">Túi mù may mắn</a>
      </div>
    </div>
    <div class="header__right">
      <div class="header__right--item btn-register-download-app-store">
        <a href=""><img src="./assets/images/btn_register_download_app_store.png" alt=""></a>
      </div>
      <div class="header__right--item">
        <a href=""><img src="./assets/images/btn_login.png" alt=""></a>
      </div>
      <div class="header__right--item">
        <a href=""><img src="./assets/images/btn_register.png" alt=""></a>
      </div>
    </div>
  </div>
</header>
<section>

  <div class="section">

    <div class="section--logo">
      <img src="./assets/images/img_logo_dreamy.png" alt="">
    </div>
    <div class="section__header">
      <div class="">
        <img src="./assets/images/img_title_banner.png" alt="">
      </div>
      <div class="btn-play-introduction">
        <img src="./assets/images/btn_play_introduction.png" alt="">
      </div>
    </div>

    <div class="section__decor">
      <div class="decor-item blindbox">
        <img src="./assets/images/img_gift_blindbox.png" alt="">
      </div>

      <div class="decor-item apple-watch">
        <img src="./assets/images/img_gift_aw.png" alt="">
      </div>

      <div class="decor-item lemondane">
        <img src="./assets/images/img_gift_lemonade.png" alt="">
      </div>
    </div>

    <div class="section--action">
      <div class="btn-download">
        <img src="./assets/images/btn_download_now.png" alt="">
      </div>
    </div>
  </div>

  <div id="gift-milestones" class="section">
    <div class="section__header">
      <img src="./assets/images/s2_title.png" alt="">
    </div>

    <div class="section__body">
      <div id="gift-milestones-slide" class="carousel slide gift-milestones" data-ride="carousel"
        data-bs-interval="false">
        <div class="gift-milestones--controler">
          <a class="carousel-control-prev" href="#gift-milestones-slide" role="button" data-slide="prev">
            <img src="./assets/images/s2_arrow_prev.png" alt="">
          </a>

          <ol class="carousel-indicators">
            <li data-target="#gift-milestones-slide" data-slide-to="0" class="active">
              <div class="">
                <img src="./assets/images/img_title_20k.png" alt="">
              </div>
            </li>
            <li data-target="#gift-milestones-slide" data-slide-to="1">
              <div class="">
                <img src="./assets/images/img_title_50k.png" alt="">
              </div>
            </li>
            <li data-target="#gift-milestones-slide" data-slide-to="2">
              <div class="">
                <img src="./assets/images/img_title_100k.png" alt="">
              </div>
            </li>
            <li data-target="#gift-milestones-slide" data-slide-to="3">
              <div class="">
                <img src="./assets/images/img_title_150k.png" alt="">
              </div>
            </li>

            <li data-target="#gift-milestones-slide" data-slide-to="4">
              <div class="">
                <img src="./assets/images/img_title_200k.png" alt="">
              </div>
            </li>
          </ol>

          <a class="carousel-control-next" href="#gift-milestones-slide" role="button" data-slide="next">
            <img src="./assets/images/s2_arrow_next.png" alt="">
          </a>
        </div>

        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="./assets/images/img_gift_20k.png" alt="" />
          </div>

          <div class="carousel-item">
            <img src="./assets/images/img_gift_50k.png" alt="" />
          </div>

          <div class="carousel-item">
            <img src="./assets/images/img_gift_100k.png" alt="" />
          </div>

          <div class="carousel-item">
            <img src="./assets/images/img_gift_150k.png" alt="" />
          </div>
          <div class="carousel-item">
            <img src="./assets/images/img_gift_200k.png" alt="" />
          </div>
        </div>
      </div>
    </div>

    <div class="section__footer">
      <div class="register-progress">
        <div class="lst-gift-item">
          <div class="gift-item gift-item--active">
            <div class="gift-item--img">
              <img src="./assets/images/img_gift_pined_20k.png" alt="">
            </div>
            <div class="milestone">20.000</div>
          </div>
          <div class="gift-item gift-item--active">
            <div class="gift-item--img">
              <img src="./assets/images/img_gift_pined_50k.png" alt="">
            </div>
            <div class="milestone">50.000</div>
          </div>
          <div class="gift-item gift-item--active">
            <div class="gift-item--img">
              <img src="./assets/images/img_gift_pined_100k.png" alt="">
            </div>
            <div class="milestone">100.000</div>
          </div>
          <div class="gift-item">
            <div class="gift-item--img">
              <img src="./assets/images/img_gift_pined_150k.png" alt="">
            </div>
            <div class="milestone">150.000</div>
          </div>
          <div class="gift-item">
            <div class="gift-item--img">
              <img src="./assets/images/img_gift_pined_200k.png" alt="">
            </div>
            <div class="milestone">200.000</div>
          </div>
        </div>
        <div class="progress-bar-range">
          <input type="range" value="50">
        </div>
      </div>
    </div>

    <div class="section__decor">
      <div class="decor-item">
        <img src="./assets/images/s2_decor_1.png" alt="">
      </div>
    </div>
  </div>

  <div id="spin-gift" class="section">
    <div class="section__header">
      <img src="./assets/images/s3_title.png" alt="">
    </div>

    <div class="section__body">
      <div class="turns-total">
        <div class="turns-total--frame">
          <img src="./assets/images/frame_count_turn.png" alt="">
        </div>
        <div class="turns-total--number">Lượt còn lại: <span>12</span></div>
      </div>

      <div class="lst-box-gift">
        <div class="box-gift">
          <img src="./assets/images/img_box_purle.png" alt="">
        </div>

        <div class="box-gift">
          <img src="./assets/images/img_box_laser.png" alt="">
        </div>

        <div class="box-gift">
          <img src="./assets/images/img_box_yellow.png" alt="">
        </div>

        <div class="box-gift">
          <img src="./assets/images/img_box_green.png" alt="">
        </div>
      </div>
    </div>

    <div class="section__footer">
      <div class="spin-button">
        <img src="./assets/images/btn_open_box.png" alt="">
      </div>

      <div class="lst-action-spin">
        <div class="action-item">
          <img src="./assets/images/btn_guide.png" alt="">
        </div>

        <div class="action-item">
          <img src="./assets/images/btn_get_turn.png" alt="">
        </div>

        <div class="action-item">
          <img src="./assets/images/btn_history.png" alt="">
        </div>
      </div>
    </div>

    <div class="section__decor">
      <div class="decor-item img-gift-blindbox">
        <img src="./assets/images/img_gift_blindbox.png" alt="">
      </div>

      <div class="decor-item img-gift-lemonade">
        <img src="./assets/images/img_gift_lemonade.png" alt="">
      </div>

      <div class="decor-item img-gift-aw">
        <img src="./assets/images/img_gift_aw.png" alt="">
      </div>
    </div>
  </div>

  <div id="future-game" class="section">
    <div class="section__header">
      <img src="./assets/images/s4_title.png" alt="">
    </div>

    <div class="section__body">
      <div id="slide-future" class="carousel slide" data-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img class="d-block w-100" src="https://img.zing.vn/upload/hellocafe/source/thumb-new-1.jpg"
              alt="First slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100" src="https://img-cdn.2game.vn/2024/04/05/hello-cafe-vng-dangkytruoc-1.jpg"
              alt="Second slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100"
              src="https://lh7-us.googleusercontent.com/0MZkm7YGQ5y6417MHPPFB0SIGj8YpcLHAbtz123pfnhyDtZkgruhIpx3BW0i_GvuZGVigzxX396mJwBjfHTB6kGTge6AVZ6YxKs0J9hXA6BjwCGHjPUklznIaauZDTeZojD-PU6W058K0m5BZNf3rZk"
              alt="Third slide">
          </div>
        </div>

        <ol class="carousel-indicators">
          <li data-target="#slide-future" data-slide-to="0" class="active"></li>
          <li data-target="#slide-future" data-slide-to="1"></li>
          <li data-target="#slide-future" data-slide-to="2"></li>
        </ol>

      </div>
    </div>

    <div class="section__decor">
      <div class="decor-item">
        <img src="./assets/images/s4_decor_2.png" alt="">
      </div>


    </div>
</section>

<script src="./assets/js/jquery-3.7.1.min.js"></script>
<script src="./assets/js/bootstrap-4.6.2/bootstrap.bundle.min.js"></script>
<script src="./assets/js/main.js"></script>

</body>

</html>
